<head>

<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta name="theme-color" content="#0C1220" media="(prefers-color-scheme: dark)">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Three a Day</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column. Header, three word tabs, prompt line, 6x5 board of keycap tiles,
   hint card, keyboard docked at the bottom. Boldness lives in the tile lettering and keycap depth. */
:root {
  --paper: #ECEFF4;
  --card: #FFFFFF;
  --ink: #101A30;
  --muted: #586478;
  --line: #C6CEDB;
  --scrim: rgba(16, 26, 48, 0.5);
  --hit: #17775A;  --hit-edge: #0D4B38;  --on-hit: #FFFFFF;
  --near: #E6A800; --near-edge: #A97B00; --on-near: #171100;
  --miss: #667286; --miss-edge: #454F5F; --on-miss: #FFFFFF;
  --key: #D3DAE6;  --key-edge: #B1BBCD;

  --f-display: "Bricolage Grotesque", "Avenir Next", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "DM Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  --tile: clamp(40px, min(calc((100vw - 56px) / 5), calc((100vh - 412px) / 6)), 64px);
  --key-h: clamp(42px, 6.2vh, 54px);
}
@supports (height: 100dvh) {
  :root {
    --tile: clamp(40px, min(calc((100vw - 56px) / 5), calc((100dvh - 412px) / 6)), 64px);
    --key-h: clamp(42px, 6.2dvh, 54px);
  }
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0C1220;
    --card: #161F35;
    --ink: #E8EEF9;
    --muted: #8E9BB2;
    --line: #2A3652;
    --scrim: rgba(0, 0, 0, 0.62);
    --hit: #1E8866;  --hit-edge: #0F5A43;  --on-hit: #FFFFFF;
    --near: #D8A017; --near-edge: #8C6808; --on-near: #171100;
    --miss: #3B475F; --miss-edge: #222B3F; --on-miss: #F1F5FB;
    --key: #27324D;  --key-edge: #141B2D;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0C1220;
  --card: #161F35;
  --ink: #E8EEF9;
  --muted: #8E9BB2;
  --line: #2A3652;
  --scrim: rgba(0, 0, 0, 0.62);
  --hit: #1E8866;  --hit-edge: #0F5A43;  --on-hit: #FFFFFF;
  --near: #D8A017; --near-edge: #8C6808; --on-near: #171100;
  --miss: #3B475F; --miss-edge: #222B3F; --on-miss: #F1F5FB;
  --key: #27324D;  --key-edge: #141B2D;
  color-scheme: dark;
}
/* Colour-blind palette. Declared after the theme blocks so it wins in both themes. */
:root[data-cb="1"] {
  --hit: #D9601A;  --hit-edge: #8F3E0B;  --on-hit: #FFFFFF;
  --near: #3F86E8; --near-edge: #2459A6; --on-near: #FFFFFF;
}

*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; background: var(--paper); -webkit-text-size-adjust: 100%; }
html.lock { overflow: hidden; }
body {
  height: 100%;
  margin: 0;
  padding-inline: 16px;
  padding-block: 8px 36px;
  background: var(--paper);
  color: var(--ink);
  font: 400 16px/1.4 var(--f-body);
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; touch-action: manipulation; -webkit-appearance: none; appearance: none; cursor: pointer; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

.app {
  max-width: 440px;
  min-height: 100%;
  margin-inline: auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
  touch-action: manipulation;
}

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; min-height: 42px; }
.brand { min-width: 0; }
.wordmark { margin: 0; font: 800 25px/1 var(--f-display); letter-spacing: -0.02em; }
.date { margin: 5px 0 0; font: 500 12px/1 var(--f-mono); color: var(--muted); }
.tools { display: flex; gap: 2px; }
.icon {
  width: 40px; height: 40px; display: grid; place-items: center;
  border: 0; border-radius: 10px; background: transparent; color: var(--ink);
}
@media (hover: hover) { .icon:hover { background: var(--line); } }

/* Word tabs */
.tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tab {
  display: grid; gap: 3px; justify-items: start; align-content: center;
  min-height: 42px; padding: 5px 12px; border: 0; border-radius: 12px;
  background: var(--card); color: var(--ink); box-shadow: inset 0 0 0 2px var(--line); text-align: left;
}
.tab[aria-selected="true"] { background: var(--ink); color: var(--paper); box-shadow: none; }
.tab-name { font: 700 14px/1 var(--f-body); }
.tab-stat { display: flex; align-items: center; gap: 6px; font: 500 11px/1 var(--f-mono); opacity: 0.8; white-space: nowrap; }
.pip { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid currentColor; flex: none; }
.tab[data-st="won"] .pip { background: var(--hit); border-color: var(--hit); }
.tab[data-st="lost"] .pip { background: var(--miss); border-color: var(--miss); }
.tab[data-st="busy"] .pip { background: var(--near); border-color: var(--near); }

/* Prompt */
.prompt { margin: 0; display: flex; align-items: center; gap: 10px; min-height: 26px; }
.chip {
  font: 500 11px/1 var(--f-mono); letter-spacing: 0.1em; text-transform: uppercase;
  padding: 5px 8px; border-radius: 6px; color: var(--muted); box-shadow: inset 0 0 0 1.5px var(--line);
}
.prompt-text { font: 700 17px/1.2 var(--f-display); min-width: 0; }

/* Board */
.stage { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; gap: 8px; padding-top: 4px; }
.board { display: grid; gap: 8px; }
.row { display: grid; grid-template-columns: repeat(5, var(--tile)); gap: 6px; }
.tile {
  height: var(--tile);
  display: grid; place-items: center;
  border-radius: 10px;
  background: var(--card); color: var(--ink);
  font-family: var(--f-display); font-weight: 800; font-size: calc(var(--tile) * 0.56); line-height: 1;
  text-transform: uppercase;
  box-shadow: inset 0 0 0 2px var(--line), 0 3px 0 var(--line);
  user-select: none; -webkit-user-select: none;
}
.tile[data-s="tbd"] { box-shadow: inset 0 0 0 2px var(--ink), 0 3px 0 var(--muted); }
.tile[data-s="hit"] { background: var(--hit); color: var(--on-hit); box-shadow: 0 3px 0 var(--hit-edge); }
.tile[data-s="near"] { background: var(--near); color: var(--on-near); box-shadow: 0 3px 0 var(--near-edge); }
.tile[data-s="miss"] { background: var(--miss); color: var(--on-miss); box-shadow: 0 3px 0 var(--miss-edge); }
.tile.pop { animation: pop 0.1s ease-out; }
.tile.flip { animation: flip 0.4s ease-in-out; }
.tile.bounce { animation: bounce 0.8s ease-in-out; }
.row.shake { animation: shake 0.45s; }
@keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
@keyframes flip { 0% { transform: rotateX(0); } 50% { transform: rotateX(90deg); } 100% { transform: rotateX(0); } }
@keyframes bounce {
  0%, 20% { transform: translateY(0); } 40% { transform: translateY(-16px); }
  50% { transform: translateY(3px); } 60% { transform: translateY(-8px); }
  80% { transform: translateY(2px); } 100% { transform: translateY(0); }
}
@keyframes shake {
  0%, 100% { transform: translateX(0); } 15%, 55% { transform: translateX(-7px); } 35%, 75% { transform: translateX(7px); }
}

/* Hint and result card */
.card { width: 100%; display: grid; gap: 10px; align-content: start; min-height: 46px; }
.hintbar { display: flex; align-items: center; gap: 8px; }
.count { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 500 12px/1 var(--f-mono); color: var(--muted); }
.btn {
  min-height: 42px; padding: 0 16px; border: 0; border-radius: 10px;
  background: var(--ink); color: var(--paper); font-weight: 700; font-size: 15px; white-space: nowrap;
}
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px var(--line); }
.btn[disabled] { opacity: 0.4; cursor: default; }
.hintlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.hintlist li { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 8px; align-items: baseline; font-size: 14px; line-height: 1.35; }
.tag { font: 500 11px/1 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.result { display: grid; gap: 8px; }
.result-title { margin: 0; font: 800 21px/1.15 var(--f-display); letter-spacing: -0.01em; }
.meaning { margin: 0; font-size: 14px; line-height: 1.4; color: var(--muted); }
.meaning b { color: var(--ink); letter-spacing: 0.06em; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.next { margin: 0; font: 500 12px/1.2 var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }

/* Keyboard */
.keys { display: grid; gap: 6px; margin-top: auto; padding-top: 6px; }
.keys.off { opacity: 0.45; pointer-events: none; }
.krow { display: flex; gap: 5px; }
.spacer { flex: 0.5 1 0; }
.key {
  flex: 1 1 0; min-width: 0; height: var(--key-h); padding: 0;
  border: 0; border-radius: 8px;
  background: var(--key); color: var(--ink);
  font-weight: 700; font-size: 15px; text-transform: uppercase;
  box-shadow: 0 3px 0 var(--key-edge);
  display: grid; place-items: center;
  user-select: none; -webkit-user-select: none;
}
.key.wide { flex: 1.6 1 0; font-size: 12px; letter-spacing: 0.03em; }
.key:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--key-edge); }
.key[data-s="hit"] { background: var(--hit); color: var(--on-hit); box-shadow: 0 3px 0 var(--hit-edge); }
.key[data-s="near"] { background: var(--near); color: var(--on-near); box-shadow: 0 3px 0 var(--near-edge); }
.key[data-s="miss"] { background: var(--miss); color: var(--on-miss); box-shadow: 0 3px 0 var(--miss-edge); }

/* Toast */
.toast {
  position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 156px); transform: translateX(-50%);
  max-width: calc(100vw - 32px); padding: 10px 16px; border-radius: 10px;
  background: var(--ink); color: var(--paper); font-weight: 700; font-size: 14px; text-align: center; z-index: 30;
  pointer-events: none;
}

/* Sheets */
.scrim {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 20;
  display: flex; align-items: flex-end; justify-content: center; background: var(--scrim);
}
.sheet {
  width: 100%; max-width: 480px; max-height: 88vh; max-height: 88dvh; overflow-y: auto;
  padding: 16px 16px calc(20px + env(safe-area-inset-bottom, 0px));
  background: var(--card); color: var(--ink); border-radius: 18px 18px 0 0;
}
@media (min-width: 560px) { .scrim { align-items: center; } .sheet { border-radius: 18px; padding-bottom: 20px; } }
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.sheet-head h2 { margin: 0; font: 800 22px/1.1 var(--f-display); letter-spacing: -0.01em; }
.sheet p { margin: 0 0 12px; font-size: 15px; }
.sheet h3 { margin: 18px 0 8px; font: 500 11px/1 var(--f-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.statgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.stat b { display: block; font: 800 30px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.stat span { font: 500 11px/1.2 var(--f-mono); color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.dist { display: grid; gap: 6px; }
.drow { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 8px; align-items: center; font: 500 12px/1 var(--f-mono); }
.dbar { min-width: 26px; padding: 4px 8px; border-radius: 4px; background: var(--miss); color: var(--on-miss); text-align: right; font-variant-numeric: tabular-nums; }
.today { display: grid; gap: 6px; font-size: 14px; }
.today div { display: flex; justify-content: space-between; gap: 12px; }
.today span:last-child { color: var(--muted); }
.demo { --tile: 40px; display: grid; gap: 6px; margin: 4px 0 12px; }
.demo .row { gap: 5px; }
.demo .tile { font-size: 22px; }
.note { color: var(--muted); font-size: 14px; }
.switch {
  display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%;
  padding: 12px 0; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left;
}
.sw-text b { display: block; font-weight: 700; font-size: 15px; }
.sw-text small { display: block; color: var(--muted); font-size: 13px; line-height: 1.35; }
.sw-track { flex: none; width: 46px; height: 28px; border-radius: 14px; background: var(--line); position: relative; transition: background 0.15s; }
.sw-knob { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--card); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3); transition: transform 0.15s; }
.switch[aria-checked="true"] .sw-track { background: var(--hit); }
.switch[aria-checked="true"] .sw-knob { transform: translateX(18px); }
.sheet .actions { margin-top: 16px; }
.sharebox {
  width: 100%; padding: 12px; border: 0; border-radius: 10px; resize: none;
  background: var(--paper); color: var(--ink); font: 400 15px/1.5 var(--f-body); box-shadow: inset 0 0 0 2px var(--line);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
</style>

</head>

<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <h1 class="wordmark">Three a Day</h1>
      <p class="date" id="dateLine"></p>
    </div>
    <div class="tools">
      <button class="icon" id="btnStats" type="button" aria-label="Statistics">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>
      </button>
      <button class="icon" id="btnHelp" type="button" aria-label="How to play">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.6 2.2c-.8.4-1.2.9-1.2 1.8"/><path d="M12 17h.01"/></svg>
      </button>
      <button class="icon" id="btnSettings" type="button" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      </button>
    </div>
  </header>

  <div class="tabs" id="tabs" role="tablist" aria-label="Today's words"></div>
  <p class="prompt"><span class="chip">Prompt</span><span class="prompt-text" id="promptText"></span></p>

  <main class="stage">
    <div class="board" id="board" role="group" aria-label="Guess board"></div>
    <section class="card" id="card"></section>
  </main>

  <div class="keys" id="keys" aria-label="Keyboard"></div>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <h2 id="sheetTitle"></h2>
      <button class="icon" id="sheetClose" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div id="sheetBody"></div>
  </div>
</div>

  /* ---------- Card ---------- */

  /* ---------- Render all ---------- */
  function renderAll() {
    renderHeader();
    renderTabs();
    renderPrompt();
    renderBoard();
    renderKeys();
    renderCard();
  }
  function setActive(i) {

  }
  function applySettings() {

  }

  /* ---------- Toast ---------- */
  function toast(msg, ms) {
    toastEl.textContent = msg;
    toastEl.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.hidden = true; }, ms || 1500);
  }

  /* ---------- Input ---------- */
  function typeLetter(ch) {
    if (busy || sheetKind) return;
    var g = G();
    if (g.st !== 'play' || buf[active].length >= COLS) return;
    buf[active] += ch;
    var t = rowTiles(g.g.length)[buf[active].length - 1];

    restart(t, 'pop', 120);
  }
  function backspace() {

  function hardCheck(word) {
    var g = G(), a = W().w, need = {};

      var prev = g.g[p], res = score(prev, a), cnt = {};

        if (res[i] === 'hit' && word.charAt(i) !== prev.charAt(i)) return 'Letter ' + (i + 1) + ' must be ' + prev.charAt(i).toUpperCase();
        if (res[i] !== 'miss') cnt[prev.charAt(i)] = (cnt[prev.charAt(i)] || 0) + 1;
      }
      Object.keys(cnt).forEach(function (k) { need[k] = Math.max(need[k] || 0, cnt[k]); });
    }
    var keys = Object.keys(need);
    for (var j = 0; j < keys.length; j++) {
      var have = word.split('').filter(function (c) { return c === keys[j]; }).length;

  /* ---------- Share ---------- */
  function shareText() {
    var E = store.settings.cb
      ? { hit: '\u{1F7E7}', near: '\u{1F7E6}', miss: '⬛' }

      lines.push('', 'Word ' + (i + 1) + ': ' + result + (g.hints ? ' (' + plural(g.hints, 'hint') + ')' : ''));

  /* ---------- Day rollover and timers ---------- */
